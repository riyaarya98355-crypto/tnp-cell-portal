<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T&P Cell | Student Sign Up</title>
    <!-- Supabase JS v2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: "Segoe UI", Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .signup-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { margin-bottom: 20px; color: #333; text-align: center; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #2563eb; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: 600; }
        button:hover { background-color: #1d4ed8; }
        .login-link { text-align: center; margin-top: 15px; font-size: 14px; }
        .login-link a { color: #2563eb; text-decoration: none; }
    </style>
</head>
<body>

    <div class="signup-card">
        <h2>Student Register</h2>
        <form id="signupForm">
  <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" id="signupButton">Sign Up</button>
        </form>
        <div class="login-link">
            Already have an account? <a href="login.html">Login here</a>
        </div>
    </div>

    <script>
        // SUPABASE CONFIGURATION
        const SUPABASE_URL = "https://hpbksldyuxqdoexbzxro.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_Y7KwVS2i_F7BXsmCfKKA_yXVZGpuH";

        // Initialize Supabase v2 client safely
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const signupForm = document.getElementById("signupForm");
        signupForm.addEventListener("submit", async function(e) {
            e.preventDefault();
            
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const signupButton = document.getElementById("signupButton");

            signupButton.disabled = true;
            signupButton.innerText = "Creating account...";

            // Register user with Supabase Auth
            const { data, error } = await supabaseClient.auth.signUp({
                email: email,
                password: password
            });

            if (error) {
                alert("Error: " + error.message);
                signupButton.disabled = false;
                signupButton.innerText = "Sign Up";
            } else {
                alert("Registration successful! You can now log in.");
                window.location.href = "login.html";
            }
        });
    </script>
</body>
</html>
